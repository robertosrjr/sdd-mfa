spring:
  main:
    log-startup-info: false
  application:
    name: mfa-stepup-service
  datasource:
    url: jdbc:h2:mem:mfadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

mfa:
  audit:
    pseudonym-key: ${MFA_AUDIT_PSEUDONYM_KEY:}
  idempotency:
    retention: PT24H
    lease: PT30S

management:
  tracing:
    baggage:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

